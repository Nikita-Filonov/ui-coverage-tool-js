name: Build

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
        required: false

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
